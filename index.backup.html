<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- No remote scripts/styles loaded — everything ships locally with the app -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' pixel-player: data:;" />
  <title>Pixel Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎮 PIXEL PLAYER</h1>
    <button id="choose-folder-btn">Choose Music Folder</button>
  </header>

  <main>
    <ul id="track-list"></ul>
  </main>

  <footer id="player-bar">
    <img id="now-playing-art" src="" alt="" />
    <div id="now-playing-info">
      <div id="now-playing-title">No track loaded</div>
      <div id="now-playing-artist"></div>
    </div>
    <audio id="audio" controls></audio>
  </footer>

  <script src="renderer.js"></script>
</body>
</html>
