<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' pixel-player: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://usercontent.jamendo.com; media-src 'self' pixel-player: https:; connect-src 'self';"
  />

  <meta name="viewport" content="width=device-width, -scale=1.0" />

  <title>Pixel Player</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <img class="vine-garland" src="assets/decorations/vine-garland.png" alt="" aria-hidden="true">
      <div class="logo"><h1>PixelPlay</h1></div>
      <nav class="playlist-nav" aria-label="Playlists">
        <button class="playlist-item active" data-playlist="playlist-1"><img src="assets/decorations/Teddy.png" alt=""><span>Playlist 1</span></button>
        <button class="playlist-item" data-playlist="playlist-2"><img src="assets/decorations/Rosebush.png" alt=""><span>Playlist 2</span></button>
        <button class="playlist-item" data-playlist="playlist-3"><img src="assets/decorations/Toadstool.png" alt=""><span>Playlist 3</span></button>
        <button class="playlist-item" data-playlist="playlist-4"><img src="assets/decorations/Strawberry.png" alt=""><span>Playlist 4</span></button>
        <button class="playlist-item" data-playlist="favourites"><img src="assets/player/favourite.png" alt=""><span>Favourites</span></button>
        <button id="choose-folder-btn" class="playlist-item add-playlist"><img src="assets/decorations/Add.png" alt=""><span>Add Playlist</span></button>
      </nav>

      <!-- Floating music notes above the record player -->
      <span class="note-float note-1" aria-hidden="true">♪</span>
      <span class="note-float note-2" aria-hidden="true">♫</span>
      <span class="note-float note-3" aria-hidden="true">♬</span>

      <!-- Soft ambient glow the turntable "sits" on -->
      <div class="turntable-glow" aria-hidden="true"></div>

      <!-- ===================================================
           ANIMATED SIDEBAR TURNTABLE
           Layer order (back → front):
             1. player-base  — static suitcase + platter
             2. vinyl-sprite — angled spinning record (8-frame)
             3. tonearm      — pivoting needle arm
             4. indicator    — red LED pulse dot
           =================================================== -->
      <div class="sidebar-record-player" id="sidebar-turntable" role="img" aria-label="Animated pixel-art record player">

        <!-- Static base / suitcase -->
        <img
          class="turntable-base"
          src="assets/turntable/player-base.png"
          alt=""
          draggable="false"
        >

        <!-- Angled vinyl: CSS sprite, 8 frames stacked vertically.
             Animation is paused by default; JS adds .is-playing
             to the wrapper to start it. -->
        <div class="turntable-vinyl-wrap">
          <div class="turntable-vinyl-sprite" aria-hidden="true"></div>
        </div>

        <!-- Tonearm — pivots around its top-left pivot point -->
        <img
          class="turntable-arm"
          src="assets/turntable/tonearm.png"
          alt=""
          draggable="false"
        >

        <!-- Red LED / indicator dot -->
        <span class="turntable-indicator" aria-hidden="true"></span>

      </div>
    </aside>

    <main class="room">
      <div class="room-background"></div>
      <div class="ambient-glow"></div>
      <div class="dust-motes" id="dust-motes"></div>
      <div class="room-content">

        <!-- PixelPlayer search / online discovery -->
        <section class="music-search" aria-label="Search music">
          <div class="search-box">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input
              id="music-search-input"
              type="search"
              placeholder="Search songs, artists or albums..."
              autocomplete="off"
              spellcheck="false"
              aria-label="Search songs, artists or albums"
              aria-controls="search-results"
              aria-expanded="false"
            />
            <button id="clear-search-btn" class="clear-search" type="button" aria-label="Clear search" hidden>×</button>
          </div>
          <div id="search-results" class="search-results" role="listbox" aria-label="Music search results" hidden></div>
        </section>

        <section class="room-header">
          <div class="clock"><span id="current-time">08:45</span><small>PM</small><em>Fri, Aug 15, 2026</em></div>
          <div class="weather"><span class="weather-icon">☀</span><strong>28°C</strong><small>Mostly cloudy</small></div>
        </section>

        <section class="current-playlist">
          <h2><img src="assets/decorations/Teddy.png" alt=""> <span id="current-folder-name">Playlist 1</span></h2>
          <p><span id="playlist-count">0/0</span> playing</p>
        </section>

        <section class="queue-panel">
          <div class="queue-header"><h2>Up next</h2><span>QUEUE</span></div>
          <ul id="track-list" class="track-list">
            <li class="empty">
              <img src="assets/decorations/Teddy.png" alt="">
              <strong>Your music room is waiting</strong>
              <span>Choose a music folder to fill this playlist with songs.</span>
              <button class="empty-action" type="button">Choose music folder</button>
            </li>
          </ul>
        </section>

      </div>

      <section class="player-panel">
        <div class="album-art-container">
          <img class="album-vinyl" src="assets/vinyl/vinyl.png" alt="">
          <img id="now-playing-art" src="assets/vinyl/no-song-placeholder.svg" alt="Album artwork">
        </div>
        <div class="song-information">
          <div id="now-playing-title" class="song-title">No song selected</div>
          <div id="now-playing-artist" class="song-artist">Choose a song to begin</div>
        </div>
        <div class="player-controls">
          <button id="random-btn" class="player-button" title="Random"><img src="assets/player/random.png" alt="Random"></button>
          <button id="previous-btn" class="player-button" title="Previous"><img src="assets/player/previous.png" alt="Previous"></button>
          <button id="play-btn" class="player-button play-button" title="Play"><img src="assets/player/play.png" alt="Play"></button>
          <button id="next-btn" class="player-button" title="Next"><img src="assets/player/next.png" alt="Next"></button>
          <button id="favourite-btn" class="player-button" title="Favourite"><img src="assets/player/favourite.png" alt="Favourite"></button>
        </div>
        <div class="progress-area">
          <span id="current-time-display">00:00</span>
          <div class="progress-bar" aria-label="Music progress">
            <div class="seek-tube"></div>
            <div id="progress" class="progress"></div>
          </div>
          <span id="duration-display">--:--</span>
        </div>
        <audio id="audio" preload="metadata"></audio>
      </section>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>

</html>
